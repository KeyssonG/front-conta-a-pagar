<h1>{{ title() }}</h1>
<div class="container">
  <nav class="navigation">
    <button 
      class="btn-nav" 
      [class.active]="mostrarLista()" 
      (click)="toggleLista()">
      📋 Listar Contas
    </button>
    <button 
      class="btn-nav" 
      [class.active]="mostrarCadastro()" 
      (click)="toggleCadastro()">
      ➕ Cadastrar Conta
    </button>
  </nav>
  
  <app-lista-contas *ngIf="mostrarLista()"></app-lista-contas>
  <app-cadastro-conta 
    *ngIf="mostrarCadastro()" 
    (contaCadastrada)="onContaCadastrada()">
  </app-cadastro-conta>
</div>
<router-outlet></router-outlet>
